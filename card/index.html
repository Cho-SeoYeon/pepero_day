<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>빼빼로 뽑기</title>
  <meta name="description" content="볼을 눌러 랜덤 빼빼로 카드를 뽑아보세요!">
  <meta property="og:title" content="빼빼로 카드팩이 도착했어요 🎴">
  <meta property="og:description" content="볼을 눌러 랜덤 빼빼로 카드를 뽑아보세요!">
  <meta name="theme-color" content="#fdf5d3">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <header class="topbar">
    <span class="badge">🎴 PEPERO EDITION</span>
    <button class="sound" id="sound" type="button" aria-pressed="true">🔊 사운드 <b>ON</b></button>
  </header>

  <main class="stage">
    <p class="to" id="toLine">빼빼로데이 카드팩이 도착했어요 🎁</p>
    <h1 id="title">볼을 눌러 빼빼로를 뽑아보세요!</h1>

    <div class="arena" id="arena">
      <div class="rays"></div>
      <div class="flash"></div>
      <button class="ball" id="ball" type="button" aria-label="볼 열기">
        <span class="ball-top" id="ballTop"></span>
        <span class="ball-bottom" id="ballBottom"></span>
      </button>
      <p class="tap" id="tap">TAP!</p>
      <div class="card-wrap" id="cardWrap">
        <div class="tilt" id="tilt">
          <div class="card3d">
            <div class="face front" id="front"></div>
            <div class="face back"><span>PEPERO<br>EDITION</span></div>
          </div>
        </div>
      </div>
      <div class="sparkles" id="sparkles"></div>
    </div>

    <div class="talk">
      <div class="dialog" id="dialog">
        <p id="dialogText"></p>
        <span class="caret" id="caret">▼</span>
      </div>
      <div class="choice hidden" id="choice" role="menu" aria-label="다시 뽑으시겠습니까?">
        <p class="q">다시 뽑으시겠습니까?</p>
        <div class="opts">
          <button type="button" role="menuitem" class="on">예</button>
          <button type="button" role="menuitem">아니오</button>
        </div>
      </div>
    </div>

    <div class="actions" id="actions">
      <button class="btn ghost" id="dexBtn" type="button">📖 도감 <span id="dexCount">0/20</span></button>
    </div>

    <section class="dex hidden" id="dex">
      <p class="dex-title">나의 빼빼로 도감</p>
      <div class="dex-grid" id="dexGrid"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="card.js"></script>
</body>
</html>
